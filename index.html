/* Header navigasi horizontal dan dashboard sesuai referensi */
.app{display:block;min-height:100vh}
.sidebar{display:none}
.main{margin:0;width:100%;min-width:0}
.topbar{height:120px;background:var(--navy);border:0;color:#dce9f7;padding:0 32px;display:flex;align-items:center;gap:34px;position:sticky;top:0;z-index:30}
.brand{height:auto;padding:0;border:0;display:flex;align-items:center;gap:15px;flex:none;text-decoration:none;color:inherit}
.brand .brand-mark{width:76px;height:76px;border-radius:21px;font-size:25px}
.brand strong{font:800 19px 'Plus Jakarta Sans';color:#fff;white-space:nowrap}
.brand small{font-size:11px;color:#c1d8f2;letter-spacing:.5px;margin-top:6px;white-space:nowrap}
.nav{display:flex;align-items:center;gap:7px;overflow:visible;padding:0;flex:1;min-width:0}
.nav button{width:auto;margin:0;padding:13px 14px;border-radius:10px;color:#d3dfed;font-size:14px;white-space:nowrap;gap:9px}
.nav button:hover,.nav button.active{background:#ffffff18;color:#fff;box-shadow:none}
.nav .nav-symbol{font-size:16px;opacity:.9}
.nav-group{position:relative}
.nav-group>.nav-trigger{display:flex;align-items:center;background:transparent}
.chevron{font-size:17px;margin-left:1px;color:#b8c9dc}
.nav-menu{display:none;position:absolute;top:calc(100% + 9px);left:0;min-width:235px;padding:8px;background:#fff;border:1px solid #e7edf4;border-radius:12px;box-shadow:0 12px 28px #071d3526;z-index:50}
.nav-group.open .nav-menu,.nav-group:hover .nav-menu{display:block}
.nav-menu button{display:flex;width:100%;padding:12px 12px;color:#243449;border-radius:8px;text-align:left;font-size:14px}
.nav-menu button:hover,.nav-menu button.active{background:#f3f7fb;color:#172b42;box-shadow:none}
.nav-menu button span{width:17px;text-align:center;font-size:16px}
.nav-menu-right{left:auto;right:0}
.top-account{display:flex;align-items:center;gap:13px;flex:none}
.top-account .avatar{width:58px;height:58px;font-size:23px}
.top-account .admin-meta{text-align:left}
.top-account .admin-meta b{color:#fff;font-size:14px}
.top-account .admin-meta small{color:#b8c9dc;font-size:12px}
#logoutBtn{border-color:#bd6170;color:#e17883;background:transparent;margin-left:7px;padding:11px 14px}
#logoutBtn:hover{background:#ffffff12}
.mobile-menu{display:none}
.content{padding:39px 42px 55px;max-width:1800px}
.eyebrow{font-size:12px;color:#4c80ad}
.welcome h1{font-size:31px;margin:15px 0 7px}
.welcome p{font-size:16px;margin-bottom:30px}
.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-bottom:28px}
.stat{border-radius:17px;padding:26px 27px;min-height:178px;box-shadow:0 8px 24px rgba(24,54,89,.045)}
.stat-top{font-size:16px}
.stat-icon{width:56px;height:56px;border-radius:16px;font-size:21px}
.stat strong{font-size:35px;margin:14px 0 5px}
.stat small{font-size:12px}
@media(max-width:1350px){
 .topbar{gap:18px;padding:0 22px}
 .brand .brand-mark{width:62px;height:62px}
 .brand strong{font-size:16px}
 .nav{gap:2px}
 .nav button{font-size:12px;padding:12px 9px}
 .top-account{gap:8px}
 .top-account .avatar{width:48px;height:48px}
}
@media(max-width:980px){
 .topbar{height:auto;min-height:90px;flex-wrap:wrap;padding:15px 20px;gap:14px}
 .brand{margin-right:auto}
 .nav{order:3;flex-basis:100%;overflow:visible;flex-wrap:wrap}
 .top-account .admin-meta{display:none}
 .content{padding:28px 22px}
}
@media(max-width:650px){
 .topbar{padding:13px 14px}
 .brand .brand-mark{width:48px;height:48px;border-radius:14px;font-size:17px}
 .brand strong{font-size:14px}
 .brand small{font-size:9px}
 .nav{gap:4px}
 .nav button{font-size:11px;padding:10px 8px}
 .nav-group{position:static}
 .nav-menu{top:100%;left:12px;right:12px;min-width:0}
 .nav-menu-right{left:12px;right:12px}
 .top-account .avatar{width:40px;height:40px}
 #logoutBtn{padding:9px}
 #logoutBtn span{display:none}

 .stats{grid-template-columns:1fr 1fr;gap:10px}
 .stat{padding:16px;min-height:135px}
 .stat strong{font-size:25px}
 .stat-top{font-size:12px}
 .stat-icon{width:38px;height:38px;font-size:16px}
 .welcome h1{font-size:23px}
 .welcome p{font-size:13px}
}

/* Penyegaran header, identitas logo, dan menu akun administrator */
:root{
  --navy:#102f53;
  --navy2:#173f6b;
  --blue:#2d83d5;
  --bg:#f3f6fb;
  --line:#e6edf5;
  --shadow:0 12px 32px rgba(20,48,82,.055);
}
body{background:var(--bg);font-family:'DM Sans',sans-serif}
.topbar{
  min-height:104px;height:auto;padding:17px 30px;gap:25px;
  background:linear-gradient(105deg,#102f53 0%,#153b65 100%);
  box-shadow:0 5px 22px rgba(8,30,55,.12);
}
.brand{gap:14px;min-width:220px}
.brand .brand-mark{
  width:64px;height:64px;border-radius:18px;flex:none;
  background:linear-gradient(145deg,#328ddd,#2375c4);
  box-shadow:0 7px 18px rgba(0,0,0,.12);
  overflow:hidden;position:relative;cursor:pointer;
  outline-offset:4px;transition:transform .18s ease,box-shadow .18s ease;
}
.brand .brand-mark:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(0,0,0,.18)}
.logo-fallback{display:grid;place-items:center;width:100%;height:100%;color:#fff;font:800 23px 'Plus Jakarta Sans'}
.brand-logo-image{width:100%;height:100%;object-fit:contain;padding:7px;background:#fff}
.brand strong{font-size:18px;letter-spacing:.35px}
.brand small{font-size:10px;letter-spacing:.8px;color:#c7d9ec}
.nav{justify-content:center;gap:5px;flex:1}
.nav button{font-size:13px;padding:12px 11px;border-radius:10px;transition:background .18s ease,color .18s ease}
.nav button.active,.nav button:hover{background:rgba(255,255,255,.13)}
.nav-group>.nav-trigger{gap:8px}
.chevron{font-size:15px;opacity:.8}
.nav-menu{top:calc(100% + 13px);border-radius:13px;padding:7px;box-shadow:0 18px 38px rgba(12,35,61,.2)}
.nav-menu button{font-size:13px;padding:11px 12px}
.top-account{position:relative;margin-left:auto;flex:none;z-index:55}
.account-trigger{
  display:flex;align-items:center;gap:11px;padding:5px 7px 5px 5px;
  border:1px solid transparent;border-radius:13px;background:transparent;
  color:#fff;text-align:left;transition:background .18s ease,border-color .18s ease;
}
.account-trigger:hover,.top-account.menu-open .account-trigger{
  background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.13)
}
.top-account .avatar{width:48px;height:48px;font-size:19px;background:#2d83d5}
.top-account .admin-meta{text-align:left;min-width:0}
.top-account .admin-meta b{font-size:13px;color:#fff;white-space:nowrap}
.top-account .admin-meta small{font-size:11px;color:#c0d2e5;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-chevron{font-size:17px;color:#c7d9ec;margin-left:2px;transition:transform .18s ease}
.top-account.menu-open .account-chevron{transform:rotate(180deg)}
.account-menu{
  display:none;position:absolute;right:0;top:calc(100% + 12px);width:245px;
  padding:9px;background:#fff;border:1px solid #e8eef5;border-radius:14px;
  box-shadow:0 18px 42px rgba(7,28,51,.22);color:var(--ink);
}
.top-account.menu-open .account-menu{display:block;animation:accountDrop .16s ease-out}
@keyframes accountDrop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.account-menu-heading{padding:10px 11px 13px;border-bottom:1px solid #edf1f6;margin-bottom:7px}
.account-menu-heading strong{display:block;font-size:13px;color:#1d3048}
.account-menu-heading small{display:block;color:#8191a6;font-size:11px;margin-top:5px;overflow-wrap:anywhere}
#logoutBtn.account-logout{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;
  border:0;border-radius:9px;background:#fff3f3;color:#c84d58;
  font-size:13px;font-weight:700;text-align:left;margin:0;
}
#logoutBtn.account-logout:hover{background:#ffe7e8}
.content{max-width:1760px;padding:36px 44px 58px}
.welcome h1{font-size:29px;letter-spacing:-.7px}
.welcome p{color:#8192a8}
.stats{gap:20px}
.stat{border:1px solid #e7edf5;border-radius:18px;box-shadow:0 10px 28px rgba(22,50,82,.045);transition:transform .18s ease,box-shadow .18s ease}
.stat:hover{transform:translateY(-2px);box-shadow:0 15px 32px rgba(22,50,82,.075)}
.stat-top{color:#788ba4}
.stat-icon{background:#edf5ff;color:#267dca}
.panel{border-radius:17px;box-shadow:0 10px 28px rgba(22,50,82,.045)}
@media(max-width:1450px){
  .topbar{gap:15px;padding-left:22px;padding-right:22px}
  .brand{min-width:195px}
  .brand .brand-mark{width:58px;height:58px}
  .brand strong{font-size:16px}
  .nav{gap:1px}
  .nav button{font-size:12px;padding:11px 8px}
  .top-account .admin-meta small{max-width:145px}
}
@media(max-width:1120px){
  .topbar{flex-wrap:wrap;gap:12px 18px;padding:14px 20px}
  .brand{order:1}
  .top-account{order:2}
  .nav{order:3;flex-basis:100%;justify-content:flex-start;flex-wrap:wrap}
  .top-account .admin-meta{display:block}
  .content{padding:30px 25px 48px}
}
@media(max-width:650px){
  .topbar{padding:12px 14px;gap:10px}
  .brand{min-width:0;gap:10px}
  .brand .brand-mark{width:46px;height:46px;border-radius:13px}
  .brand strong{font-size:13px}
  .brand small{font-size:8px}
  .top-account .avatar{width:38px;height:38px;font-size:16px}
  .top-account .admin-meta{display:none}
  .account-trigger{gap:4px;padding:3px}
  .account-menu{right:0;width:220px}
  .nav{gap:3px}
  .nav button{font-size:11px;padding:9px 8px}
  .nav-menu{top:calc(100% + 7px)}
  .content{padding:23px 14px 40px}
  .welcome h1{font-size:22px}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:15px;min-height:132px}
}


/* Dashboard mengikuti referensi kartu warna 4 kolom */
.dashboard-reference-head{
 display:flex;align-items:center;justify-content:space-between;gap:16px;
 margin:0 0 27px;padding:0 2px;
}
.dashboard-page-title{display:flex;align-items:baseline;gap:9px;color:#667487;font-size:14px}
.dashboard-page-title strong{color:#24364b;font-size:14px;font-weight:700}
.dashboard-breadcrumb{display:flex;align-items:center;gap:18px;color:#738094;font-size:13px}
.dashboard-breadcrumb span:first-child{color:#26394f;font-weight:700}
.dashboard-reference-grid{
 display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;
 margin-bottom:28px;
}
.dashboard-color-tile{
 position:relative;display:flex;align-items:center;justify-content:space-between;
 gap:12px;width:100%;min-width:0;min-height:116px;padding:17px 19px;
 border:0;border-radius:2px;color:#fff;text-align:left;overflow:hidden;
 box-shadow:0 4px 12px rgba(24,45,68,.08);
 transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;
 cursor:pointer;
}
.dashboard-color-tile:hover{transform:translateY(-3px);filter:brightness(1.035);box-shadow:0 9px 18px rgba(24,45,68,.14)}
.dashboard-color-tile:focus-visible{outline:3px solid #173f6b;outline-offset:3px}
.dashboard-color-tile .tile-copy{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.dashboard-color-tile .tile-copy strong{font-size:23px;line-height:1.15;font-weight:700}

<script>
/* Diagnostik mandiri: memberi pesan jika Firebase module gagal dimuat. */
window.__firebaseLoginReady = false;
document.addEventListener("submit", function (event) {
  if (event.target && event.target.id === "loginForm" && !window.__firebaseLoginReady) {
    event.preventDefault();
    event.stopImmediatePropagation();
    const message = document.getElementById("loginMessage");
    if (message) {
      message.textContent = "Sistem login belum siap. JavaScript Firebase tidak berhasil dimuat. Periksa koneksi internet, lalu jalankan website melalui Live Server (http://localhost), bukan dengan membuka file HTML langsung. Jika masih gagal, buka F12 > Console dan kirimkan pesan error berwarna merah.";
      message.style.display = "block";
    }
  }
}, true);
window.addEventListener("error", function (event) {
  const message = document.getElementById("loginMessage");
  if (message && !window.__firebaseLoginReady) {
    message.textContent = "Terjadi kesalahan saat memuat aplikasi: " + (event.message || "JavaScript gagal dijalankan") + ". Buka F12 > Console untuk melihat detail.";
    message.style.display = "block";
  }
});
window.addEventListener("unhandledrejection", function (event) {
  const message = document.getElementById("loginMessage");
  if (message && !window.__firebaseLoginReady) {
    const reason = event.reason && event.reason.message ? event.reason.message : String(event.reason || "Kesalahan tidak diketahui");
    message.textContent = "Koneksi atau pemuatan Firebase bermasalah: " + reason + ". Periksa koneksi internet dan Console browser.";
    message.style.display = "block";
  }
});
</script>

function fmtStatus(s){const x=String(s||"-");let cl=["tersedia","aktif","lunas","dikembalikan","Baik"].includes(x)?"green":["terlambat","belum_lunas","nonaktif","Rusak Berat","hilang"].includes(x)?"red":["dipinjam","Rusak Ringan","perbaikan"].includes(x)?"amber":"";return `<span class="pill ${cl}">${esc(x.replaceAll("_"," "))}</span>`}
async function getRows(name,force=false){if(cache[name]&&!force)return cache[name];const snap=await getDocs(collection(db,name));const rows=snap.docs.map(d=>({id:d.id,...d.data()}));cache[name]=rows;return rows}

async function renderDashboard(root){

 <div class="dashboard-reference-head">
   <div class="dashboard-page-title"><strong>Dashboard</strong><span>Control panel</span></div>
   <div class="dashboard-breadcrumb"><span>⌂ Home</span><span>Dashboard</span></div>

   <div class="table-wrap"><table><thead><tr><th>Peminjam</th><th>Judul Buku</th><th>Tanggal</th><th>Status</th></tr></thead><tbody id="recentLoans"></tbody></table></div>
 </div>

   <div class="panel-head"><div><h3>Ringkasan Koleksi</h3><p>Kondisi ketersediaan eksemplar</p></div></div>
   <div class="toolbar" id="collectionSummary"></div>
 </div>`;
 const names=["books","copies","members","loans","returns","fines"];
 const [books,copies,members,loans,returns,fines]=await Promise.all(names.map(n=>getRows(n,true)));
 const available=copies.filter(x=>x.status==="tersedia").length;
 const active=loans.filter(x=>x.status==="dipinjam"||x.status==="terlambat").length;
 const overdue=loans.filter(x=>x.status==="terlambat"||((x.status==="dipinjam")&&x.dueDate&&new Date(x.dueDate)<new Date())).length;
 const unpaid=fines.filter(x=>x.status!=="lunas").reduce((a,x)=>a+Number(x.amount||0),0);
 const metrics=[
  {label:"Total Anggota",value:members.length,icon:"♟",tone:"cyan",note:"Anggota terdaftar"},
  {label:"Peminjaman Aktif",value:active,icon:"➤",tone:"green",note:"Buku sedang dipinjam"},
  {label:"Total Buku",value:books.length,icon:"▤",tone:"red",note:"Judul koleksi"},
  {label:"Denda Belum Lunas",value:rupiah(unpaid),icon:"＄",tone:"orange",note:"Tagihan anggota"}
 ];
 const shortcuts=[
  {label:"Kelola Buku",icon:"▤",tone:"red",page:"books",note:"Data dan koleksi buku"},
  {label:"Kelola Anggota",icon:"♟",tone:"orange",page:"members",note:"Data anggota perpustakaan"},
  {label:"Status Buku",icon:"◇",tone:"cyan",page:"conditions",note:"Kondisi dan ketersediaan"},
  {label:"Data Eksemplar",icon:"▥",tone:"green",page:"copies",note:"Inventaris fisik buku"}
 ];
 $("#statsGrid").innerHTML=metrics.map(x=>`
  <button type="button" class="dashboard-color-tile metric-tile tone-${x.tone}" aria-label="${x.label}">

   <span class="tile-copy"><span>${x.label}</span><small>${x.note}</small></span>
   <span class="tile-icon" aria-hidden="true">${x.icon}</span>
  </button>`).join("");
 $("#statsGrid").querySelectorAll("[data-dashboard-page]").forEach(button=>{
   button.addEventListener("click",()=>navTo(button.dataset.dashboardPage));
 });
 $("#statsGrid").querySelectorAll(".metric-tile").forEach((button,index)=>{
   const destinations=["members","loans","books","fines"];
   button.addEventListener("click",()=>navTo(destinations[index]));
 });
 const recent=[...loans].sort((a,b)=>new Date(b.loanDate||0)-new Date(a.loanDate||0)).slice(0,8);
 $("#recentLoans").innerHTML=recent.length?recent.map(x=>`<tr><td>${esc(x.memberName||"-")}</td><td>${esc(x.bookTitle||"-")}</td><td>${dateText(x.loanDate)}</td><td>${fmtStatus(x.status)}</td></tr>`).join(""):`<tr><td colspan="4" class="empty">Belum ada transaksi peminjaman.</td></tr>`;
 $("#collectionSummary").innerHTML=`<span class="pill green">Tersedia: ${available}</span><span class="pill amber">Dipinjam: ${copies.filter(x=>x.status==="dipinjam").length}</span><span class="pill red">Perlu perhatian: ${copies.filter(x=>["perbaikan","hilang"].includes(x.status)).length}</span>`;

async function nextSequence(collectionName,field,prefix,width){
 const rows=await getRows(collectionName,true);
 let max=0;
 rows.forEach(r=>{const m=String(r[field]||"").match(new RegExp("^"+prefix.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(\\d+)$"));if(m)max=Math.max(max,Number(m[1]));});
 return prefix+String(max+1).padStart(width,"0");
}
async function openBookForm(record){
 const isEdit=!!record;
 let suggestedCode=record?.bookCode||await nextSequence("books","bookCode","RB-BK-",6);
 const inputs=collections.books.fields.map(f=>{
  const [key,label,kind,required]=f;const value=record?.[key]??"";
  if(kind==="textarea")return `<div class="field" style="grid-column:1/-1"><label>${label}</label><textarea name="${key}" rows="3">${esc(value)}</textarea></div>`;
  if(key==="bookCode")return `<div class="field"><label>${label} *</label><input name="${key}" value="${esc(suggestedCode)}" readonly required></div>`;
  return `<div class="field"><label>${label}${required?" *":""}</label><input name="${key}" type="${kind}" value="${esc(value)}" ${required?"required":""} ${kind==="number"?'min="0"':''}></div>`;
 }).join("");
 const copyField=isEdit?"":`<div class="field"><label>Jumlah Eksemplar Awal *</label><input name="initialCopies" type="number" min="1" max="450" value="1" required><small class="muted">Sistem akan membuat kode inventaris INV000001, INV000002, dan seterusnya.</small></div>`;
 showModal(`${isEdit?"Edit":"Tambah"} Data Buku`,`${inputs}${copyField}`,"Simpan Buku");
 $("#recordForm").onsubmit=async e=>{
  e.preventDefault();const fd=new FormData(e.target),data={};
  collections.books.fields.forEach(f=>{let v=fd.get(f[0]);if(f[2]==="number")v=v===""?0:Number(v);data[f[0]]=v});
  data.updatedAt=serverTimestamp();
  const btn=e.target.querySelector('[type="submit"]');btn.disabled=true;btn.textContent="Menyimpan...";
  try{
   if(isEdit){
    const copies=await getRows("copies",true);const related=copies.filter(c=>c.bookId===record.id);
    if(related.length>450)throw new Error("Jumlah eksemplar terkait melebihi batas pembaruan sekaligus. Hubungi pengelola sistem untuk pembaruan bertahap.");
    const batch=writeBatch(db);
    batch.update(doc(db,"books",record.id),data);
    related.forEach(c=>batch.update(doc(db,"copies",c.id),{bookTitle:data.title,bookCode:data.bookCode,updatedAt:serverTimestamp()}));
    await batch.commit();
    invalidate("books","copies");toast("Data buku dan relasi eksemplarnya berhasil diperbarui.");
   }else{
    const copiesCount=Number(fd.get("initialCopies"));
    if(!Number.isInteger(copiesCount)||copiesCount<1||copiesCount>450)throw new Error("Jumlah eksemplar harus antara 1 sampai 450.");
    const existing=await getRows("books",true);
    if(existing.some(b=>String(b.bookCode||"").toLowerCase()===String(data.bookCode).toLowerCase()))throw new Error("Kode buku sudah digunakan. Muat ulang lalu coba lagi.");
    const firstInventory=await nextSequence("copies","inventoryCode","INV",6);
    const start=Number(firstInventory.slice(3));
    const batch=writeBatch(db);
    const bookRef=doc(collection(db,"books"));
    batch.set(bookRef,{...data,createdAt:serverTimestamp()});
    for(let i=0;i<copiesCount;i++){
     const inventoryCode="INV"+String(start+i).padStart(6,"0");
     const copyRef=doc(collection(db,"copies"));
     batch.set(copyRef,{inventoryCode,bookId:bookRef.id,bookCode:data.bookCode,bookTitle:data.title,condition:"Baik",status:"tersedia",location:data.shelf||"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
    }
    await batch.commit();invalidate("books","copies");toast(`${data.title} berhasil ditambahkan dengan ${copiesCount} eksemplar.`);
   }
   closeModal();renderPage();
  }catch(err){toast("Gagal menyimpan: "+err.message,true);btn.disabled=false;btn.textContent="Simpan Buku"}
 };
}

 $("#recordForm").onsubmit=async e=>{

 };

async function confirmDelete(type,id){
 try{
  if(type==="books"){
   const copies=await getRows("copies",true);const related=copies.filter(c=>c.bookId===id);
   if(related.length)throw new Error(`Buku masih memiliki ${related.length} eksemplar. Hapus atau pindahkan eksemplar terlebih dahulu.`);
  }
  if(type==="copies"){
   const copies=await getRows("copies",true),copy=copies.find(c=>c.id===id);
   if(copy?.status==="dipinjam")throw new Error("Eksemplar sedang dipinjam dan tidak dapat dihapus.");
  }
  if(!confirm("Hapus data ini? Tindakan ini tidak dapat dibatalkan."))return;
  await deleteDoc(doc(db,type,id));invalidate(type);toast("Data berhasil dihapus.");renderPage();
 }catch(e){toast("Tidak dapat menghapus: "+e.message,true)}
}
function exportCSV(title,rows,fields){const head=fields.map(f=>f[1]);const lines=[head,...rows.map(r=>fields.map(f=>String(r[f[0]]??"").replaceAll('"','""')))];const csv="\uFEFF"+lines.map(a=>a.map(x=>`"${x}"`).join(";")).join("\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=title.toLowerCase().replaceAll(" ","_")+".csv";a.click();URL.revokeObjectURL(a.href)}

function localYMD(d=new Date()){
 const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
 return `${y}-${m}-${day}`;
}
function dayDiff(a,b){
 if(!a||!b)return 0;
 const [ay,am,ad]=String(a).slice(0,10).split("-").map(Number);
 const [by,bm,bd]=String(b).slice(0,10).split("-").map(Number);
 return Math.max(0,Math.floor((Date.UTC(by,bm-1,bd)-Date.UTC(ay,am-1,ad))/86400000));
}
function effectiveLoanStatus(loan){
 if(loan.status==="dikembalikan")return "dikembalikan";
 if(loan.status==="terlambat"|| (loan.dueDate&&dayDiff(loan.dueDate,localYMD())>0))return "terlambat";
 return "dipinjam";
}

  const options=active.map(x=>`<option value="${esc(x.id)}">${esc(x.loanCode||"")} · ${esc(x.memberName||"")} · ${esc(x.bookTitle||"")} (${esc(x.inventoryCode||"")})</option>`).join("");
  const code=await nextSequence("returns","returnCode","RB-PG-",6);
  showModal("Proses Pengembalian",`<div class="field" style="grid-column:1/-1"><label>Transaksi Peminjaman *</label><select name="loanId" id="returnLoanSelect" required><option value="">Pilih transaksi aktif</option>${options}</select></div><div class="field"><label>Tanggal Kembali *</label><input type="date" name="returnDate" value="${localYMD()}" required></div><div class="field"><label>Kondisi Buku *</label><select name="condition" required><option value="Baik">Baik</option><option value="Rusak Ringan">Rusak Ringan</option><option value="Rusak Berat">Rusak Berat</option><option value="Hilang">Hilang</option></select></div><div class="section-note" id="finePreview" style="grid-column:1/-1;margin:0">Pilih transaksi untuk melihat perkiraan denda keterlambatan. Tarif: ${rupiah(FINE_PER_DAY)} per hari.</div>`,"Simpan Pengembalian");
  const updatePreview=()=>{const loan=active.find(x=>x.id===$("#returnLoanSelect").value);if(!loan){$("#finePreview").textContent=`Tarif denda: ${rupiah(FINE_PER_DAY)} per hari.`;return}const dt=$("#recordForm [name=returnDate]").value;const late=dayDiff(loan.dueDate,dt);$("#finePreview").innerHTML=`Jatuh tempo: <b>${dateText(loan.dueDate)}</b>. Keterlambatan: <b>${late} hari</b>. Perkiraan denda: <b>${rupiah(late*FINE_PER_DAY)}</b>.`};
  $("#returnLoanSelect").onchange=updatePreview;$("#recordForm [name=returnDate]").onchange=updatePreview;
  $("#recordForm").onsubmit=async e=>{
   e.preventDefault();const fd=new FormData(e.target),loan=active.find(x=>x.id===fd.get("loanId")),btn=e.target.querySelector('[type="submit"]');
   if(!loan)return toast("Pilih transaksi peminjaman yang valid.",true);
   const returnDate=fd.get("returnDate"),condition=fd.get("condition");
   if(returnDate<loan.loanDate)return toast("Tanggal kembali tidak boleh sebelum tanggal pinjam.",true);
   const lateDays=dayDiff(loan.dueDate,returnDate),fineAmount=lateDays*FINE_PER_DAY;
   btn.disabled=true;btn.textContent="Memproses...";
   try{
    const batch=writeBatch(db),returnRef=doc(collection(db,"returns"));
    batch.set(returnRef,{returnCode:code,loanId:loan.id,loanCode:loan.loanCode||"",memberId:loan.memberId||"",memberName:loan.memberName||"",bookId:loan.bookId||"",bookTitle:loan.bookTitle||"",copyId:loan.copyId||"",inventoryCode:loan.inventoryCode||"",returnDate,condition,lateDays,fineAmount,createdAt:serverTimestamp()});
    batch.update(doc(db,"loans",loan.id),{status:"dikembalikan",returnDate,fineAmount,lateDays,updatedAt:serverTimestamp()});
    if(loan.copyId){
     const copyStatus=condition==="Hilang"?"hilang":condition==="Rusak Berat"?"perbaikan":"tersedia";
     batch.update(doc(db,"copies",loan.copyId),{status:copyStatus,condition,updatedAt:serverTimestamp()});
    }
    if(fineAmount>0){
     const fineCode=await nextSequence("fines","fineCode","RB-DN-",6);
     const fineRef=doc(collection(db,"fines"));
     batch.set(fineRef,{fineCode,loanId:loan.id,loanCode:loan.loanCode||"",memberId:loan.memberId||"",memberName:loan.memberName||"",amount:fineAmount,lateDays,status:"belum_lunas",createdAt:serverTimestamp()});
    }
    await batch.commit();invalidate("returns","loans","copies","fines");closeModal();toast(fineAmount>0?`Pengembalian berhasil. Denda ${rupiah(fineAmount)} tercatat.`:"Pengembalian berhasil dicatat.");renderReturnPage(root);
   }catch(err){toast("Gagal memproses pengembalian: "+err.message,true);btn.disabled=false;btn.textContent="Simpan Pengembalian"}
  };
 };
}
async function renderFinePage(root){
 const fines=await getRows("fines",true);
 const unpaid=fines.filter(x=>x.status!=="lunas"),paid=fines.filter(x=>x.status==="lunas");
 root.innerHTML=`<div class="page-heading"><div><h1>Denda Perpustakaan</h1><p>Perhitungan denda keterlambatan Rp2.000 per hari dan pencatatan pembayaran.</p></div></div><div class="stats"><div class="stat"><span class="muted">Belum Lunas</span><strong>${unpaid.length}</strong><small>Tagihan aktif</small></div><div class="stat"><span class="muted">Total Belum Lunas</span><strong>${rupiah(unpaid.reduce((s,x)=>s+Number(x.amount||0),0))}</strong><small>Jumlah tagihan</small></div><div class="stat"><span class="muted">Sudah Lunas</span><strong>${paid.length}</strong><small>Transaksi dibayar</small></div></div><div class="panel"><div class="toolbar"><input id="fineSearch" placeholder="Cari kode, peminjam..."><select id="fineFilter"><option value="">Semua pembayaran</option><option value="belum_lunas">Belum lunas</option><option value="lunas">Lunas</option></select><button class="btn btn-light" id="fineRefresh">↻ Muat Ulang</button><button class="btn btn-outline" id="fineExport">Ekspor CSV</button></div><div class="table-wrap"><table><thead><tr><th>Kode Denda</th><th>Peminjam</th><th>Kode Pinjam</th><th>Terlambat</th><th>Jumlah</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="fineRows"></tbody></table></div></div>`;
 const draw=()=>{const q=$("#fineSearch").value.toLowerCase(),f=$("#fineFilter").value;const arr=fines.filter(x=>(!f||x.status===f)&&[x.fineCode,x.memberName,x.loanCode].some(v=>String(v||"").toLowerCase().includes(q)));$("#fineRows").innerHTML=arr.length?arr.map(x=>`<tr><td>${esc(x.fineCode||"-")}</td><td>${esc(x.memberName||"-")}</td><td>${esc(x.loanCode||"-")}</td><td>${Number(x.lateDays||0)} hari</td><td>${rupiah(x.amount)}</td><td>${fmtStatus(x.status)}</td><td>${x.status==="lunas"?`<span class="muted">${dateText(x.paidDate)}</span>`:`<button class="btn btn-light" data-paid="${esc(x.id)}">Tandai Lunas</button>`}</td></tr>`).join(""):'<tr><td colspan="7" class="empty">Belum ada data denda.</td></tr>'};
 draw();$("#fineSearch").oninput=draw;$("#fineFilter").onchange=draw;
 $("#fineRefresh").onclick=()=>{invalidate("fines");renderFinePage(root)};
 $("#fineExport").onclick=()=>exportCSV("Denda",fines,collections.fines.fields);
 $("#fineRows").onclick=async e=>{const b=e.target.closest("[data-paid]");if(!b)return;if(!confirm("Konfirmasi pembayaran denda ini sudah diterima?"))return;b.disabled=true;try{await updateDoc(doc(db,"fines",b.dataset.paid),{status:"lunas",paidDate:localYMD(),updatedAt:serverTimestamp()});invalidate("fines");toast("Pembayaran denda berhasil dicatat.");renderFinePage(root)}catch(err){toast("Gagal memperbarui pembayaran: "+err.message,true);b.disabled=false}};
}

async function renderConditions(root){const rows=await getRows("copies",true);root.innerHTML=`<div class="page-heading"><div><h1>Kondisi Buku</h1><p>Pemantauan kondisi setiap eksemplar</p></div><button class="btn btn-primary" id="goCopies">Kelola Eksemplar</button></div><div class="stats"><div class="stat"><span class="muted">Kondisi Baik</span><strong>${rows.filter(x=>x.condition==="Baik").length}</strong></div><div class="stat"><span class="muted">Rusak Ringan</span><strong>${rows.filter(x=>x.condition==="Rusak Ringan").length}</strong></div><div class="stat"><span class="muted">Rusak Berat / Hilang</span><strong>${rows.filter(x=>["Rusak Berat"].includes(x.condition)||x.status==="hilang").length}</strong></div></div><div class="panel"><div class="panel-head"><h3>Daftar Kondisi Eksemplar</h3></div><div class="table-wrap"><table><thead><tr><th>Kode Inventaris</th><th>Judul Buku</th><th>Kondisi</th><th>Status</th><th>Lokasi</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${esc(x.inventoryCode)}</td><td>${esc(x.bookTitle)}</td><td>${fmtStatus(x.condition)}</td><td>${fmtStatus(x.status)}</td><td>${esc(x.location||"-")}</td></tr>`).join(""):'<tr><td colspan="5" class="empty">Belum ada data eksemplar.</td></tr>'}</tbody></table></div></div>`;$("#goCopies").onclick=()=>navTo("copies")}
async function renderBarcode(root){const rows=await getRows("copies",true);root.innerHTML=`<div class="page-heading"><div><h1>Barcode / QR Code</h1><p>Buat identitas visual untuk setiap eksemplar buku</p></div></div><div class="panel"><div class="toolbar"><select id="barcodeSelect"><option value="">Pilih kode inventaris</option>${rows.map(x=>`<option value="${esc(x.inventoryCode||x.id)}">${esc(x.inventoryCode||x.id)} · ${esc(x.bookTitle||"")}</option>`).join("")}</select><button class="btn btn-primary" id="makeQR">Buat QR Code</button><button class="btn btn-outline" id="printQR">Cetak</button></div><div class="qr-area" id="qrArea"><span class="muted">Pilih eksemplar, lalu klik Buat QR Code.</span></div></div><p class="muted" style="font-size:11px">QR Code berisi kode inventaris. Untuk menghasilkan barcode 1D, gunakan kode inventaris sebagai teks pada label barcode.</p>`;
 $("#makeQR").onclick=()=>{const v=$("#barcodeSelect").value;if(!v)return toast("Pilih eksemplar terlebih dahulu.",true);$("#qrArea").innerHTML=`<h3>${esc(v)}</h3><div id="qrCanvas"></div><p class="muted">Ruang Baca Fisika · FMIPA Unila</p>`;const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=()=>new QRCode($("#qrCanvas"),{text:v,width:190,height:190,colorDark:"#102f53",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});document.body.appendChild(s)};
 $("#printQR").onclick=()=>window.print();
}
async function renderReports(root){const [books,copies,members,loans,returns,fines]=await Promise.all(["books","copies","members","loans","returns","fines"].map(n=>getRows(n,true)));const unpaid=fines.filter(x=>x.status!=="lunas").reduce((s,x)=>s+Number(x.amount||0),0);root.innerHTML=`<div class="page-heading"><div><h1>Laporan Perpustakaan</h1><p>Ringkasan data dan ekspor laporan</p></div></div><div class="report-grid"><div class="report-card"><h3>Laporan Koleksi Buku</h3><p>Daftar seluruh judul buku yang tersimpan di sistem.</p><b>${books.length} judul buku</b><p><button class="btn btn-light" id="rBooks">Unduh CSV</button></p></div><div class="report-card"><h3>Laporan Inventaris</h3><p>Daftar eksemplar dan status ketersediaannya.</p><b>${copies.length} eksemplar</b><p><button class="btn btn-light" id="rCopies">Unduh CSV</button></p></div><div class="report-card"><h3>Laporan Anggota</h3><p>Data anggota perpustakaan yang terdaftar.</p><b>${members.length} anggota</b><p><button class="btn btn-light" id="rMembers">Unduh CSV</button></p></div><div class="report-card"><h3>Laporan Peminjaman</h3><p>Riwayat transaksi peminjaman buku.</p><b>${loans.length} transaksi</b><p><button class="btn btn-light" id="rLoans">Unduh CSV</button></p></div><div class="report-card"><h3>Laporan Pengembalian</h3><p>Riwayat pengembalian buku.</p><b>${returns.length} transaksi</b><p><button class="btn btn-light" id="rReturns">Unduh CSV</button></p></div><div class="report-card"><h3>Laporan Denda</h3><p>Total denda yang belum dilunasi.</p><b>${rupiah(unpaid)}</b><p><button class="btn btn-light" id="rFines">Unduh CSV</button></p></div></div>`;
 [["rBooks","books"],["rCopies","copies"],["rMembers","members"],["rLoans","loans"],["rReturns","returns"],["rFines","fines"]].forEach(([id,type])=>$("#"+id).onclick=()=>exportCSV(collections[type].title,({books,copies,members,loans,returns,fines})[type],collections[type].fields));
}
function renderSettings(root){root.innerHTML=`<div class="page-heading"><div><h1>Pengaturan Sistem</h1><p>Informasi dan kebijakan dasar perpustakaan</p></div></div><div class="panel"><div class="panel-head"><div><h3>Identitas Perpustakaan</h3><p>Informasi yang ditampilkan pada aplikasi</p></div></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Nama Perpustakaan</label><input value="Ruang Baca Fisika" disabled></div><div class="field"><label>Institusi</label><input value="FMIPA Universitas Lampung" disabled></div><div class="field"><label>Denda per Hari (Rp)</label><input value="${FINE_PER_DAY.toLocaleString("id-ID")}" disabled></div><div class="field"><label>Email Administrator</label><input value="${esc(activeUser?.email||"")}" disabled></div></div><div class="section-note">Konfigurasi Firebase dan daftar administrator berada pada bagian KONFIGURASI FIREBASE di dalam file index.html. Untuk mengubah kebijakan denda, ubah nilai FINE_PER_DAY pada script.</div></div></div><div class="panel"><div class="panel-head"><h3>Keamanan</h3></div><div class="modal-body"><p class="muted">Aplikasi menggunakan Firebase Authentication untuk login administrator. Batasi akses koleksi Firestore melalui Security Rules. Jangan mengandalkan pembatasan menu di browser sebagai satu-satunya lapisan keamanan.</p><button class="btn btn-outline" id="logoutSettings">Keluar dari akun</button></div></div>`;$("#logoutSettings").onclick=()=>$("#logoutBtn").click()}

$("#loginForm").onsubmit=async e=>{
 e.preventDefault();
 const btn=$("#loginBtn"),msg=$("#loginMessage");
 msg.style.display="none";msg.textContent="";
 const placeholders=["GANTI_API_KEY","GANTI_PROJECT_ID","GANTI_MESSAGING_SENDER_ID","GANTI_APP_ID"];
 if(placeholders.some(x=>Object.values(firebaseConfig).includes(x))){
  msg.textContent="Konfigurasi Firebase belum diisi. Buka bagian KONFIGURASI FIREBASE pada index.html, lalu masukkan konfigurasi Web App dari Firebase Console.";
  msg.style.display="block";return;
 }
 btn.disabled=true;btn.textContent="Memeriksa akun...";
 try{await signInWithEmailAndPassword(auth,$("#loginEmail").value.trim(),$("#loginPassword").value)}
 catch(err){
  console.error("Firebase login error:",err.code,err.message);
  const messages={
   "auth/invalid-credential":"Email atau password tidak cocok. Pastikan akun sudah dibuat di Firebase Authentication dan password benar.",
   "auth/user-not-found":"Akun administrator belum terdaftar. Buka Firebase Console > Authentication > Users, lalu tambahkan akun administrator.",
   "auth/wrong-password":"Password akun Firebase tidak sesuai. Masukkan password yang benar atau reset password melalui Firebase Console.",
   "auth/invalid-email":"Format email tidak valid. Periksa kembali alamat email.",
   "auth/too-many-requests":"Firebase membatasi percobaan login sementara. Tunggu beberapa saat sebelum mencoba lagi.",
   "auth/network-request-failed":"Koneksi ke Firebase gagal. Periksa internet, lalu muat ulang halaman.",
   "auth/operation-not-allowed":"Login Email/Password belum aktif. Aktifkan di Firebase Console > Authentication > Sign-in method.",
   "auth/unauthorized-domain":"Domain website belum diizinkan. Tambahkan domain pada Firebase Console > Authentication > Settings > Authorized domains. Untuk pengujian lokal, tambahkan localhost.",
   "auth/invalid-api-key":"API Key Firebase tidak valid. Periksa kembali konfigurasi Web App pada file HTML.",
   "auth/configuration-not-found":"Konfigurasi Authentication tidak ditemukan pada proyek Firebase ini. Periksa projectId dan pengaturan Authentication.",
   "auth/internal-error":"Firebase mengalami kesalahan internal. Periksa konfigurasi proyek dan coba kembali."
  };
  msg.textContent=(messages[err.code]||("Login gagal ("+(err.code||"tanpa kode")+"): "+(err.message||"Kesalahan tidak diketahui")))+" [Kode: "+(err.code||"unknown")+"]";
  msg.style.display="block";
 }finally{btn.disabled=false;btn.textContent="Masuk ke Dashboard"}
};
$("#logoutBtn").onclick=async()=>{try{await signOut(auth)}catch(e){toast(e.message,true)}};
onAuthStateChanged(auth,user=>{
 if(user){
  const email=(user.email||"").toLowerCase();
  if(!ADMIN_EMAILS.map(x=>x.toLowerCase()).includes(email)){signOut(auth);toast("Akun ini tidak terdaftar sebagai administrator.",true);return}
  activeUser=user;$("#loginView").classList.add("hidden");$("#appView").classList.remove("hidden");$("#adminEmail").textContent=user.email||"";$("#accountMenuEmail").textContent=user.email||"";navTo("dashboard");
 }else{activeUser=null;$("#appView").classList.add("hidden");$("#loginView").classList.remove("hidden");}
});
window.__firebaseLoginReady = true;
</script>
